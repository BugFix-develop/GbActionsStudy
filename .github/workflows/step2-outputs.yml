name: Step2 Outputs

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.gen.outputs.app_version }}
      scan_passed: ${{steps.gen.outputs.scan_passed}}
    steps:
      - id: meta
        run: |
          echo "app_version=1.0.0" >> "$GITHUB_OUTPUT"
          echo "scan_passed=true" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.scan_passed == 'true' }}
    steps:
      - name: "вывод"
        run: echo ${{ needs.job1.outputs.app_version }}
