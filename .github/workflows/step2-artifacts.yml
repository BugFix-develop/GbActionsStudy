name: Step2 Artifacts

on: 
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Create report
        run: |
           echo "Scan OK: 0 issues" >  report.txt
        
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: report.txt
          retention-days: 1
          if-no-files-found: error
  
  read-report:
    needs: generate-report
    runs-on: ubuntu-latest
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: security-report
      - name: Print report
        run: cat report.txt
